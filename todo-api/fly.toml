# fly.toml app configuration file generated for joe-todo-api on 2026-10-05T12:22:07+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'joe-todo-api'
primary_region = 'iad'

[build]
[deploy]
  release_command = 'npm run migrate'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
